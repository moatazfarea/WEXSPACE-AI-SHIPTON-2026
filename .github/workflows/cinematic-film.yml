name: WEXSPACE 60fps cinematic film
on:
  push:
    branches: [main]
    paths:
      - cinema/**
      - .github/workflows/cinematic-film.yml
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare capture runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg xvfb python3
          npm init -y >/dev/null 2>&1
          npm i playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          curl -L --fail -o cinema/wexspace-logo.png https://raw.githubusercontent.com/moatazfarea/wexspace-iew-agentic-fleet/shipaton-nextgen-20260930-r01/site/assets/wexspace-logo.png
      - name: Start real browser runtime and 60fps capture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p submission
          python3 -m http.server 8080 --directory . >/tmp/http.log 2>&1 &
          Xvfb :99 -screen 0 1280x720x24 -ac +extension GLX +render -noreset >/tmp/xvfb.log 2>&1 &
          sleep 2
          export DISPLAY=:99
          ffmpeg -y -f x11grab -framerate 60 -video_size 1280x720 -i :99 -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p /tmp/wexspace-silent.mp4 >/tmp/ffmpeg.log 2>&1 &
          FFPID=$!
          node cinema/capture.mjs
          sleep 1
          kill -INT $FFPID || true
          wait $FFPID || true
      - name: Master film with original synthetic score
        shell: bash
        run: |
          set -euo pipefail
          DUR=$(ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 /tmp/wexspace-silent.mp4)
          ffmpeg -y -i /tmp/wexspace-silent.mp4             -f lavfi -i "sine=frequency=55:sample_rate=48000:duration=$DUR"             -f lavfi -i "sine=frequency=110:sample_rate=48000:duration=$DUR"             -filter_complex "[1:a]volume=0.035[a1];[2:a]volume=0.012,tremolo=f=0.2:d=0.7[a2];[a1][a2]amix=inputs=2:normalize=0[a]"             -map 0:v -map "[a]" -c:v libx264 -preset medium -crf 19 -r 60 -c:a aac -b:a 128k -shortest -movflags +faststart submission/WEXSPACE_SHIPATON_FINAL_CINEMATIC_60FPS.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate,avg_frame_rate,codec_name -show_entries format=duration,size -of json submission/WEXSPACE_SHIPATON_FINAL_CINEMATIC_60FPS.mp4 > submission/WEXSPACE_SHIPATON_FINAL_CINEMATIC_60FPS.meta.json
          sha256sum submission/WEXSPACE_SHIPATON_FINAL_CINEMATIC_60FPS.mp4 > submission/WEXSPACE_SHIPATON_FINAL_CINEMATIC_60FPS.sha256
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: WEXSPACE_SHIPATON_FINAL_CINEMATIC_60FPS
          path: |
            submission/WEXSPACE_SHIPATON_FINAL_CINEMATIC_60FPS.mp4
            submission/WEXSPACE_SHIPATON_FINAL_CINEMATIC_60FPS.meta.json
            submission/WEXSPACE_SHIPATON_FINAL_CINEMATIC_60FPS.sha256
          retention-days: 1
          compression-level: 0
      - name: Publish film to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "WEXSPACE CI"
          git config user.email "actions@users.noreply.github.com"
          git add submission/WEXSPACE_SHIPATON_FINAL_CINEMATIC_60FPS.*
          if ! git diff --cached --quiet; then
            git commit -m "video: publish 60fps WEXSPACE cinematic master [skip ci]"
            git push
          fi
